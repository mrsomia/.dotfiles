#:schema https://docs.jj-vcs.dev/latest/config-schema.json

[ui]
pager = ["delta", "--side-by-side", "--line-numbers", "--navigate"]
diff-formatter = ":git"
default-command = "log"

[user]
name = "Sachin Somia"
email = "sachinsomia@gmail.com"

[templates]
git_push_bookmark = '"sach/push-" ++ change_id.short()'

[revsets]
log = "present(@) | ancestors(immutable_heads().., 2) | trunk()" # Default

[revset-aliases]
llog = "present(@) | ancestors(remote_bookmarks().., 2) | trunk()"

[aliases]
ll = ["log", "-r", "llog"]
